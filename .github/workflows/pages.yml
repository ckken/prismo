name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_BASE_PATH: /${{ github.event.repository.name }}/
      PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      PUBLIC_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Verify static route entries
        run: |
          test -f apps/web/dist/dashboard/default/index.html
          test -f apps/web/dist/dashboard/sales/index.html
          test -f apps/web/dist/dashboard/commerce/index.html
          test -f apps/web/dist/dashboard/agent-ops/index.html
          test -f apps/web/dist/dashboard/crm/index.html
          test -f apps/web/dist/dashboard/finance/index.html
          test -f apps/web/dist/catalog/index.html
          test -f apps/web/dist/workflow/index.html
          test -f apps/web/dist/404.html
          test ! -e apps/web/dist/playground/index.html
      - run: bun run skill:validate
      - run: bun run proof:install
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
